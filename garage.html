let yaw=0,pitch=0;const clampP=p=>Math.max(-1.569,Math.min(1.569,p));
function setDir(){const c=Math.cos(pitch);cam.lookAt(cam.position.clone().add(new THREE.Vector3(Math.sin(yaw)*c,Math.sin(pitch),-Math.cos(yaw)*c)))}
function view(k){const v=VIEWS.find(q=>q[0]==k);curView=k;cam.position.copy(V(...v[2]));const t=V(...v[3]).sub(cam.position);
 yaw=Math.atan2(t.x,-t.z);pitch=clampP(Math.atan2(t.y,Math.hypot(t.x,t.z)));cam.fov=v[4];cam.updateProjectionMatrix();setDir();apply()}

let drag=null;
wrap.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];wrap.setPointerCapture(e.pointerId);wrap.style.cursor='grabbing'});
wrap.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag[0],dy=e.clientY-drag[1];drag=[e.clientX,e.clientY];const k=.004*cam.fov/70;yaw-=dx*k;pitch=clampP(pitch+dy*k);setDir();render()});
const up=()=>{drag=null;wrap.style.cursor='grab'};wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
