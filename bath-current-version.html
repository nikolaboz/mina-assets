<h2 class="sr-only">Lit 3D render of the gym bathroom with a fourth toilet option: TOTO Aimes with Washlet S7A, tank concealed in a ledge box under the L-shaped stone counter</h2>
<div id="wrap" style="position:relative;width:100%;height:480px;border-radius:12px;overflow:hidden;background:#1c1c1c;touch-action:none;cursor:grab"></div>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center">
<button onclick="view('t')" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Vanity and toilet</button>
<button onclick="view('side')" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Toilet from the side</button>
<button onclick="view('v')" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">From shower, toward vanity</button>
<button onclick="view('s')" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">From vanity, toward shower</button>
<button onclick="view('g')" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">In the shower, shaving</button>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center">
<button id="tb" onclick="cycleToilet()" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Toilet</button>
<button id="ld" onclick="toggleLid()" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Lid: closed</button>
<button id="sh" onclick="toggleShelf()" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Shelf at 44 in: on</button>
<button id="bs" onclick="cycleSplash()" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Backsplash: 4 in stone</button>
</div>
<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;align-items:center">
<button id="tl" onclick="cycleTile()" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Shower tile: 24×48 white</button>
<button id="rd" onclick="toggleRoomDoor()" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Bathroom door: open</button>
<button id="cd" onclick="toggleCabDoors()" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Cabinet doors: closed</button>
<button id="fin" onclick="toggleFinish()" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Finish: matte</button>
<label style="font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:8px">Light level <input id="lv" type="range" min="30" max="140" value="75" step="5" style="width:140px"><span id="lvo">75%</span></label>
</div>

function applyFinish(){mats.forEach(m=>{if(m.transparent)return;if(matte){m.roughness=Math.max(m.userData.r,0.92);m.metalness=0;m.emissiveIntensity=m.userData.e*0.5;}else{m.roughness=m.userData.r;m.metalness=m.userData.m;m.emissiveIntensity=m.userData.e;}m.needsUpdate=true;});}
function applyLevel(){lights.forEach(([l,b])=>l.intensity=b*level);}
const names=['Wall-hung on Omega pre-wall, L counter','Skirted one-piece, L counter','Leap / T05 smart toilet, vanity-only counter','TOTO Aimes + Washlet S7A, boxed tank, L counter'];
let opt=3,lidUp=false,shelfOn=true,mi=0;
const smodes=['4 in stone','stone to mirror (44 in)','none'];
function setBtn(id,txt,en){const b=document.getElementById(id);b.textContent=txt;b.disabled=!en;b.style.opacity=en?1:0.4;}
function update(){gW.visible=opt===0;gA.visible=opt===1;gB.visible=opt===2;gT.visible=opt===3;
lwO.visible=lbO.visible=ltO.visible=lidUp;lwC.visible=lbC.visible=ltC.visible=!lidUp;shelf.visible=shelfOn;
[sV4,spW[0],spA[0],sB4,spT[0]].forEach(g=>g.visible=mi===0);[sV44,spW[1],spA[1],sB44,spT[1]].forEach(g=>g.visible=mi===1);
document.getElementById('tb').textContent='Toilet: '+names[opt];
setBtn('ld','Lid: '+(lidUp?'open':'closed'),opt!==1);
setBtn('sh','Shelf at 44 in: '+(shelfOn?'on':'off'),opt===2);
document.getElementById('bs').textContent='Backsplash: '+smodes[mi];render();}
const look={yaw:0,pitch:0};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function render(){ren.render(scene,cam);}
function applyLook(){look.pitch=clamp(look.pitch,-1.2,1.2);const d=new THREE.Vector3(Math.cos(look.pitch)*Math.sin(look.yaw),Math.sin(look.pitch),Math.cos(look.pitch)*Math.cos(look.yaw));cam.lookAt(cam.position.clone().add(d));render();}
function setLook(p,t,fov){cam.fov=fov;cam.updateProjectionMatrix();cam.position.set(...p);const d=new THREE.Vector3(...t).sub(cam.position).normalize();look.yaw=Math.atan2(d.x,d.z);look.pitch=Math.asin(d.y);applyLook();}
function view(k){if(k==='v')setLook([18,62,44],[110,56,28],76);if(k==='s')setLook([88,62,34],[0,64,24],76);if(k==='g')setLook([16,62,16],[16,62,60],82);if(k==='t')setLook([64,60,40],[110,34,20],72);if(k==='side')setLook([90,40,56],[98,28,8],72);}
let roomOpen=true,cabOpen=false;
function cycleToilet(){opt=(opt+1)%4;update();}
function toggleLid(){if(opt===1)return;lidUp=!lidUp;update();}
function toggleShelf(){if(opt!==2)return;shelfOn=!shelfOn;update();}
function cycleSplash(){mi=(mi+1)%3;update();}
function toggleRoomDoor(){roomOpen=!roomOpen;dp.rotation.y=roomOpen?-80*Math.PI/180:0;document.getElementById('rd').textContent='Bathroom door: '+(roomOpen?'open':'closed');render();}
function toggleCabDoors(){cabOpen=!cabOpen;cabDoors.forEach(g=>g.rotation.y=cabOpen?-100*Math.PI/180:0);document.getElementById('cd').textContent='Cabinet doors: '+(cabOpen?'open':'closed');render();}
function cycleTile(){ti=(ti+1)%patterns.length;applyTile();applyFinish();render();}
function toggleFinish(){matte=!matte;applyFinish();document.getElementById('fin').textContent='Finish: '+(matte?'matte':'realistic sheen');render();}
const lv=document.getElementById('lv'),lvo=document.getElementById('lvo');
lv.addEventListener('input',()=>{level=lv.value/100;lvo.textContent=lv.value+'%';applyLevel();render();});
let drag=null;
wrap.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};wrap.setPointerCapture(e.pointerId);wrap.style.cursor='grabbing';});
wrap.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};look.yaw-=dx*0.004;look.pitch+=dy*0.004;applyLook();});
const up=()=>{drag=null;wrap.style.cursor='grab';};
wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
wrap.addEventListener('wheel',e=>{e.preventDefault();cam.fov=clamp(cam.fov+e.deltaY*0.03,35,95);cam.updateProjectionMatrix();render();},{passive:false});
new ResizeObserver(()=>{ren.setSize(W(),H());cam.aspect=W()/H();cam.updateProjectionMatrix();render();}).observe(wrap);
applyFinish();applyLevel();update();view('t');
</script>
