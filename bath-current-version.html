<h2 class="sr-only">Lit 3D render of the gym bathroom with separate Views and Options controls, opening on the view from the vanity toward the shower</h2>
<div id="wrap" style="position:relative;width:100%;height:480px;border-radius:12px;overflow:hidden;background:#1c1c1c;touch-action:none;cursor:grab"></div>
<div style="margin-top:12px;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-secondary)">Views</div>
<div id="views" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px"></div>
<div style="margin-top:14px;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-secondary)">Options</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;align-items:center">
<button id="gb" onclick="cycleBars()" class="opt">Grab bars</button>
<button id="cu" onclick="cycleCubby()" class="opt">Shaver niche</button>
<button id="mr" onclick="cycleMirror()" class="opt">Mirror</button>
<button id="nc" onclick="toggleNiche()" class="opt">Niche + cleat</button>
<button id="cw" onclick="toggleCW()" class="opt">Control wall joint</button>
<button id="tl" onclick="cycleTile()" class="opt">Tile colour</button>
<button id="lg" onclick="cycleLedge()" class="opt">Shower ledge</button>
<button id="sk" onclick="toggleSink()" class="opt">Sink</button>
<button id="bx" onclick="toggleBox()" class="opt">Toilet box</button>
<button id="qz" onclick="toggleQuartz()" class="opt">Quartz</button>
<button id="cd" onclick="toggleCabDoors()" class="opt">Cabinet doors</button>
<button id="rd" onclick="toggleRoomDoor()" class="opt">Bathroom door</button>
<button id="sd" onclick="toggleStuds()" class="opt">Stud lines</button>
<button id="fin" onclick="toggleFinish()" class="opt">Finish</button>
<label style="font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:8px">Light level <input id="lv" type="range" min="30" max="140" value="75" step="5" style="width:140px"><span id="lvo">75%</span></label>
</div>
<p style="font-size:13px;color:var(--text-secondary);margin:10px 0 0">Drag to look around, scroll to change lens width.</p>
<style>
button.opt,button.vw{padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer}
button.vw.on{border:1.5px solid var(--text-primary)}
</style>

function applyLevel(){lights.forEach(([l,b])=>l.intensity=b*level);}
const VIEWS=[
 ['s','From vanity, toward shower',[88,62,34],[0,58,26],76],
 ['c','Control wall',[22,54,24],[18,54,60],78],
 ['h','Back wall',[30,54,30],[0,52,34],80],
 ['g','In the shower',[18,62,20],[10,56,56],84],
 ['d','Head wall and niche',[26,66,40],[14,88,2],80],
 ['win','Window wall',[62,60,16],[64,62,60],80],
 ['fl','Floor from above',[55,96,30],[55,0,30],80],
 ['v','From shower, toward vanity',[18,62,44],[110,56,28],76],
 ['t','Vanity and toilet',[64,58,40],[110,32,18],72],
 ['w','From the doorway',[46,66,4],[80,32,58],80]];
const vbar=document.getElementById('views');
VIEWS.forEach(([k,label])=>{const b=document.createElement('button');b.className='vw';b.dataset.k=k;b.textContent=label;b.onclick=()=>view(k);vbar.appendChild(b);});
const lnames=['none','tiled, 24 in high x 3 in deep','quartz-capped, 24 in high'];
const bnames=['36 in horizontal only','both (adds 24 in vertical at entry)','none'];
const cnames=['door wall, above the head','control wall','none'];
const mnames=['16 × 20 hung','12 × 16 hung','none (stored outside)'];
let li=0,bi=0,ci=0,mi=0,nicheOn=true,studsOn=false,boxOn=true,pedestal=false,grayQ=false,roomOpen=false;
function update(){
 ledgeT.visible=li===1;ledgeQ.visible=li===2;
 gBack.visible=bi<2;gVert.visible=bi===1;
 cubbyB.visible=ci===0;cubbyA.visible=ci===1;
 gNiche.visible=nicheOn;mirL.visible=mi===0;mirS.visible=mi===1;
 gStuds.visible=studsOn;gBox.visible=boxOn;gOpen.visible=!boxOn;
 gVan.visible=!pedestal;gPed.visible=pedestal;
 document.getElementById('lg').textContent='Shower ledge: '+lnames[li];
 document.getElementById('gb').textContent='Grab bars: '+bnames[bi];
 document.getElementById('cu').textContent='Shaver niche: '+cnames[ci];
 document.getElementById('mr').textContent='Mirror: '+mnames[mi];
 document.getElementById('nc').textContent='Niche + cleat: '+(nicheOn?'on':'off');
 document.getElementById('sd').textContent='Stud lines: '+(studsOn?'on':'off');
 document.getElementById('bx').textContent='Toilet box + ledge: '+(boxOn?'on':'off');
 document.getElementById('sk').textContent='Sink: '+(pedestal?'33 in black pedestal':'built-in vanity');
 document.getElementById('qz').textContent='Quartz: '+(grayQ?'light concrete gray':'soft white');
 document.getElementById('cd').textContent='Cabinet doors: '+(cabOpen?'open':'closed');
 document.getElementById('rd').textContent='Bathroom door: '+(roomOpen?'open':'closed');
 document.getElementById('fin').textContent='Finish: '+(matte?'matte':'realistic sheen');
 render();}
const look={yaw:0,pitch:0};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function render(){ren.render(scene,cam);}
function applyLook(){look.pitch=clamp(look.pitch,-1.35,1.35);const d=new THREE.Vector3(Math.cos(look.pitch)*Math.sin(look.yaw),Math.sin(look.pitch),Math.cos(look.pitch)*Math.cos(look.yaw));cam.lookAt(cam.position.clone().add(d));render();}
function view(k){const v=VIEWS.find(a=>a[0]===k);if(!v)return;
 cam.fov=v[4];cam.updateProjectionMatrix();cam.position.set(...v[2]);
 const d=new THREE.Vector3(...v[3]).sub(cam.position).normalize();
 look.yaw=Math.atan2(d.x,d.z);look.pitch=Math.asin(d.y);applyLook();
 document.querySelectorAll('button.vw').forEach(b=>b.classList.toggle('on',b.dataset.k===k));}
function toggleCW(){cwCentered=!cwCentered;rebuildTile();applyFinish();update();}
function cycleTile(){gray=!gray;rebuildTile();applyFinish();update();}
function cycleLedge(){li=(li+1)%3;update();}
function cycleBars(){bi=(bi+1)%3;update();}
function cycleCubby(){ci=(ci+1)%3;update();}
function cycleMirror(){mi=(mi+1)%3;update();}
function toggleNiche(){nicheOn=!nicheOn;update();}
function toggleStuds(){studsOn=!studsOn;update();}
function toggleBox(){boxOn=!boxOn;update();}
function toggleSink(){pedestal=!pedestal;update();}
function toggleQuartz(){grayQ=!grayQ;stone.color.setHex(grayQ?0xb8b6b0:0xf0eee9);update();}
function toggleCabDoors(){cabOpen=!cabOpen;cabDoors.forEach(g=>g.rotation.y=cabOpen?-100*Math.PI/180:0);update();}
function toggleRoomDoor(){roomOpen=!roomOpen;dp.rotation.y=roomOpen?-80*Math.PI/180:0;update();}
function toggleFinish(){matte=!matte;applyFinish();update();}
const lv=document.getElementById('lv'),lvo=document.getElementById('lvo');
lv.addEventListener('input',()=>{level=lv.value/100;lvo.textContent=lv.value+'%';applyLevel();render();});
let drag=null;
wrap.addEventListener('pointerdown',ev=>{drag={x:ev.clientX,y:ev.clientY};wrap.setPointerCapture(ev.pointerId);wrap.style.cursor='grabbing';});
wrap.addEventListener('pointermove',ev=>{if(!drag)return;const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;drag={x:ev.clientX,y:ev.clientY};look.yaw-=dx*0.004;look.pitch+=dy*0.004;applyLook();});
const up=()=>{drag=null;wrap.style.cursor='grab';};
wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
wrap.addEventListener('wheel',ev=>{ev.preventDefault();cam.fov=clamp(cam.fov+ev.deltaY*0.03,35,95);cam.updateProjectionMatrix();render();},{passive:false});
new ResizeObserver(()=>{ren.setSize(W(),H());cam.aspect=W()/H();cam.updateProjectionMatrix();render();}).observe(wrap);
applyFinish();applyLevel();update();view('s');
</script>
