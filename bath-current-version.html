<h2 class="sr-only">Lit 3D render of the gym bathroom comparing the built-in vanity with a 33 inch black freestanding pedestal sink</h2>
<div id="wrap" style="position:relative;width:100%;height:480px;border-radius:12px;overflow:hidden;background:#1c1c1c;touch-action:none;cursor:grab"></div>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center">
<button onclick="view('t')" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Vanity and toilet</button>
<button onclick="view('w')" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">From the doorway</button>
<button onclick="view('sink')" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">At the sink</button>
<button onclick="view('c')" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Control wall</button>
<button onclick="view('h')" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Back wall</button>
<button onclick="view('s')" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">From vanity, toward shower</button>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center">
<button id="sk" onclick="toggleSink()" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Sink: built-in vanity</button>
<button id="bx" onclick="toggleBox()" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Toilet box + ledge: on</button>
<button id="gb" onclick="cycleBars()" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Grab bars</button>
<button id="cu" onclick="cycleCubby()" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Shaver cubby</button>
<button id="nc" onclick="toggleNiche()" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Niche: on</button>
</div>
<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;align-items:center">
<button id="lg" onclick="cycleLedge()" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Shower ledge</button>
<button id="tl" onclick="cycleTile()" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Shower tile</button>
<button id="qz" onclick="toggleQuartz()" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Quartz: soft white</button>
<button id="rd" onclick="toggleRoomDoor()" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Bathroom door: closed</button>
<button id="fin" onclick="toggleFinish()" style="padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer">Finish: realistic sheen</button>
<label style="font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:8px">Light level <input id="lv" type="range" min="30" max="140" value="75" step="5" style="width:140px"><span id="lvo">75%</span></label>
</div>

const look={yaw:0,pitch:0};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function render(){ren.render(scene,cam);}
function applyLook(){look.pitch=clamp(look.pitch,-1.2,1.2);const d=new THREE.Vector3(Math.cos(look.pitch)*Math.sin(look.yaw),Math.sin(look.pitch),Math.cos(look.pitch)*Math.cos(look.yaw));cam.lookAt(cam.position.clone().add(d));render();}
function setLook(p,t,fov){cam.fov=fov;cam.updateProjectionMatrix();cam.position.set(...p);const d=new THREE.Vector3(...t).sub(cam.position).normalize();look.yaw=Math.atan2(d.x,d.z);look.pitch=Math.asin(d.y);applyLook();}
